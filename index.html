/* ── THEME TOKENS ─────────────────────────────────────────── */
:root {
  --accent:     #3D8B6E;
  --accent-lt:  #4FAF8A;
  --accent-dim: #2A6B54;
  --radius:     12px;
  --radius-sm:  8px;
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.12);
  --shadow-md:  0 4px 16px rgba(0,0,0,0.12);
  --trans:      background 0.2s, color 0.2s, border-color 0.2s;
}

[data-theme="dark"] {
  --bg:         #1C1C1E;
  --bg-card:    #2C2C2E;
  --bg-card2:   #3A3A3C;
  --bg-input:   #3A3A3C;
  --ink:        #F2F2F7;
  --ink-2:      #AEAEB2;
  --ink-3:      #636366;
  --border:     #38383A;
  --border-lt:  #48484A;
  --tab-bg:     #111113;
  --tab-active: #2C2C2E;
  --checked-fg: #636366;
  --red:        #FF453A;
  --header-bg:  #111113;
}

[data-theme="light"] {
  --bg:         #F2F2F7;
  --bg-card:    #FFFFFF;
  --bg-card2:   #F2F2F7;
  --bg-input:   #FFFFFF;
  --ink:        #1C1C1E;
  --ink-2:      #3C3C43;
  --ink-3:      #8E8E93;
  --border:     #D1D1D6;
  --border-lt:  #E5E5EA;
  --tab-bg:     #E5E5EA;
  --tab-active: #FFFFFF;
  --checked-fg: #AEAEB2;
  --red:        #FF3B30;
  --header-bg:  #FFFFFF;
}

/* ── RESET ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  transition: var(--trans);
}
button { cursor: pointer; font-family: inherit; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: 14px; color: var(--ink); }
ul { list-style: none; }
a { color: var(--accent); text-decoration: none; }

/* ── LAYOUT ──────────────────────────────────────────────── */
.app-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: 600px;
  margin: 0 auto;
  overflow-x: hidden;
}

/* ── HEADER ──────────────────────────────────────────────── */
.app-header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  transition: var(--trans);
}
.app-logo {
  height: 32px;
  width: auto;
  display: block;
  object-fit: contain;
}
.header-actions { display: flex; align-items: center; gap: 4px; }

/* ── ICON BUTTON BASE ───────────────────────────────────── */
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-2);
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.icon-btn:hover { background: var(--bg-card2); color: var(--ink); }
.icon-btn.danger:hover { background: rgba(255,69,58,0.1); color: var(--red); }
.icon-btn svg { display: block; }

/* ── THEME TOGGLE ───────────────────────────────────────── */
.theme-toggle { }

/* ── SYNC BTN ───────────────────────────────────────────── */
.sync-pill {
  display: flex; align-items: center; gap: 5px;
  background: var(--bg-card2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-2);
  transition: background 0.15s, color 0.15s;
}
.sync-pill:hover { color: var(--ink); }
.sync-pill.syncing svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sync-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ink-3);
  flex-shrink: 0;
}
.sync-dot.ok { background: var(--accent); }
.sync-dot.err { background: var(--red); }

/* ── BOTTOM TAB BAR ─────────────────────────────────────── */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--tab-bg);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
  max-width: 600px;
  margin: 0 auto;
}
.tab-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 4px 10px;
  color: var(--ink-3);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.2px;
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.tab-btn svg { transition: transform 0.15s; }
.tab-btn.active { color: var(--accent); }
.tab-btn.active svg { transform: scale(1.1); }

/* ── MAIN SCROLL AREA ───────────────────────────────────── */
.main-content {
  flex: 1;
  padding: 20px 16px 90px;
  overflow-y: auto;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── SECTION HEADER ─────────────────────────────────────── */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 300;
  color: var(--ink);
}

/* ── PRIMARY BUTTON ─────────────────────────────────────── */
.btn-primary {
  background: var(--accent);
  color: white;
  border-radius: var(--radius-sm);
  padding: 9px 16px;
  font-size: 13px;
  font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-primary:hover { background: var(--accent-lt); }

.btn-ghost {
  background: var(--bg-card2);
  color: var(--ink-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 500;
  transition: background 0.15s;
}
.btn-ghost:hover { background: var(--border); }

.btn-danger {
  background: transparent;
  color: var(--red);
  border: 1px solid rgba(255,69,58,0.3);
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-size: 12px;
  font-weight: 500;
  transition: background 0.15s;
}
.btn-danger:hover { background: rgba(255,69,58,0.08); }

.setup-banner strong { color: var(--accent); display: block; margin-bottom: 4px; font-size: 13px; font-weight: 600; }
.setup-banner input {
  width: 100%; margin-top: 10px;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-input);
  font-size: 13px;
  color: var(--ink);
}
.setup-banner input:focus { outline: none; border-color: var(--accent); }
.setup-banner .save-url-btn {
  margin-top: 8px;
  background: var(--accent);
  color: white;
  border-radius: var(--radius-sm);
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
}

/* ══════════════════════════════════════════════════════════
   SHOPPING TAB
══════════════════════════════════════════════════════════ */

/* Add item form */
.add-form {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 16px;
}
.add-row-main {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.add-row-main input[type="text"] {
  flex: 1;
  min-width: 120px;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  transition: border-color 0.15s;
}
.add-row-main input:focus { outline: none; border-color: var(--accent); }

.qty-wrap {
  display: flex; align-items: center;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  flex-shrink: 0;
}
.qty-btn {
  width: 28px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-2);
  font-size: 18px;
  font-weight: 300;
  transition: background 0.1s;
}
.qty-btn:hover { background: var(--border); }
.qty-val {
  min-width: 24px;
  text-align: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  padding: 0 2px;
}

.add-row-sub {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.add-row-sub select,
.add-row-sub input {
  padding: 8px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--ink);
  transition: border-color 0.15s;
  min-width: 0;
}
.add-row-sub select { flex: 1; max-width: 180px; }
.add-row-sub input { flex: 1; }
.add-row-sub select:focus,
.add-row-sub input:focus { outline: none; border-color: var(--accent); }

/* Category groups */
.cat-group { margin-bottom: 6px; }
.cat-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  user-select: none;
  transition: background 0.1s;
}
.cat-group.open .cat-header {
  border-radius: var(--radius) var(--radius) 0 0;
  border-bottom-color: transparent;
}
.cat-header:hover { background: var(--bg-card2); }
.cat-name {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--ink-2);
  display: flex; align-items: center; gap: 8px;
}
.cat-name svg { color: var(--accent); flex-shrink: 0; }
.cat-meta { display: flex; align-items: center; gap: 8px; }
.cat-badge {
  font-size: 11px;
  font-weight: 600;
  background: var(--bg-card2);
  color: var(--ink-3);
  padding: 1px 7px;
  border-radius: 10px;
}
.cat-chevron { color: var(--ink-3); transition: transform 0.15s; }
.cat-group.open .cat-chevron { transform: rotate(180deg); }
.cat-items {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius) var(--radius);
  overflow: hidden;
  display: none;
}
.cat-group.open .cat-items { display: block; }

/* Shop items */
.shop-item {
  display: flex; align-items: flex-start;
  padding: 11px 14px;
  gap: 12px;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}
.shop-item:last-child { border-bottom: none; }
.shop-item:hover { background: var(--bg-card2); }
.shop-item.is-checked { opacity: 0.5; }

.check-box {
  width: 22px; height: 22px;
  border: 2px solid var(--border-lt);
  border-radius: 6px;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.check-box:hover { border-color: var(--accent); }
.shop-item.is-checked .check-box {
  background: var(--accent);
  border-color: var(--accent);
}

.shop-item-body { flex: 1; min-width: 0; }
.shop-item-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  display: flex; align-items: baseline; gap: 6px;
  flex-wrap: wrap;
}
.shop-item.is-checked .shop-item-name {
  text-decoration: line-through;
  color: var(--checked-fg);
}
.shop-qty {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: rgba(61,139,110,0.12);
  padding: 1px 6px;
  border-radius: 4px;
}
.shop-item.is-checked .shop-qty {
  color: var(--checked-fg);
  background: var(--bg-card2);
}
.shop-item-note {
  font-size: 12px;
  color: var(--ink-3);
  margin-top: 2px;
  font-style: italic;
}

.shopping-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.checked-summary { font-size: 12px; color: var(--ink-3); }
.footer-btns { display: flex; gap: 8px; }

/* ══════════════════════════════════════════════════════════
   PLANNER TAB
══════════════════════════════════════════════════════════ */


.day-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  overflow: visible;
  transition: border-color 0.15s;
  position: relative;
  z-index: 1;
}
.day-card:focus-within {
  z-index: 10;
}
.day-card.is-today { border-color: var(--accent); }

.day-top {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--bg-card2);
  border-bottom: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) 0 0;
}
.day-card.is-today .day-top { background: rgba(61,139,110,0.1); }
.day-name {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--ink-3);
  width: 32px;
  flex-shrink: 0;
}
.day-card.is-today .day-name { color: var(--accent); }

.today-chip {
  font-size: 10px;
  font-weight: 700;
  background: var(--accent);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  letter-spacing: 0.3px;
}
.day-clear-btn {
  color: var(--ink-3);
  font-size: 16px;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 5px;
  transition: background 0.1s, color 0.1s;
}
.day-clear-btn:hover { background: var(--border); color: var(--ink); }

.day-body { padding: 10px 14px; }
.meal-wrap { position: relative; z-index: 1; }
.meal-input {
  width: 100%;
  padding: 8px 10px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--ink);
  transition: border-color 0.15s, background 0.15s;
}
.meal-input::placeholder { color: var(--ink-3); font-style: italic; }
.meal-input:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-input);
}

.suggestions-box {
  position: absolute; top: 100%; left: 0; right: 0;
  background: var(--bg-card);
  border: 1px solid var(--accent);
  border-top: none;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  z-index: 100;
  max-height: 200px;
  overflow-y: auto;
  display: none;
}
.suggestions-box.open { display: block; }
.sug-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  font-size: 13px;
  cursor: pointer;
  color: var(--ink);
  transition: background 0.1s;
}
.sug-item:hover, .sug-item.hi { background: var(--bg-card2); }
.sug-item svg { color: var(--ink-3); flex-shrink: 0; }



.planner-footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 14px;
}

/* ══════════════════════════════════════════════════════════
   RECIPES TAB
══════════════════════════════════════════════════════════ */
.recipe-search-wrap {
  position: relative;
  margin-bottom: 14px;
}
.recipe-search-wrap svg {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--ink-3); pointer-events: none;
}
.recipe-search {
  width: 100%;
  padding: 10px 12px 10px 36px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--ink);
  transition: border-color 0.15s;
}
.recipe-search:focus { outline: none; border-color: var(--accent); }
.recipe-search::placeholder { color: var(--ink-3); }

/* Recipe grid — KitchenOwl card style */
.recipe-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  min-width: 0;
}
.recipe-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.recipe-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.recipe-card:active { transform: translateY(0); }

.recipe-card-icon {
  aspect-ratio: 3/2;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-card2);
}
.recipe-card-icon svg { color: var(--ink-3); }


.recipe-card-body { padding: 10px 12px 12px; }
.recipe-card-name {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
  margin-bottom: 4px;
}
.recipe-card-note {
  font-size: 11px;
  color: var(--ink-3);
  font-style: italic;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}


/* A-Z scroll index */
.recipes-wrap {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  position: relative;
}
.recipe-grid {
  flex: 1;
  min-width: 0;
}
.az-index {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  position: sticky;
  top: 8px;
  max-height: calc(100vh - 120px);
  overflow-y: auto;
  overflow-x: hidden;
  flex-shrink: 0;
  padding: 4px 0;
  scrollbar-width: none;
}
.az-index::-webkit-scrollbar { display: none; }
.az-letter {
  font-size: 10px;
  font-weight: 600;
  color: var(--ink-3);
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.az-letter:hover, .az-letter.has-recipes { color: var(--accent); }
.az-letter.active { background: var(--accent); color: white; }
.az-letter.no-recipes { color: var(--border); cursor: default; }

/* Letter group header in grid */
.recipe-letter-group {
  grid-column: 1 / -1;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--ink-3);
  padding: 8px 2px 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2px;
}

/* Recipe detail overlay */
.recipe-detail-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 0;
}
.recipe-detail-overlay.open { display: flex; }
.recipe-detail-sheet {
  background: var(--bg-card);
  border-radius: var(--radius) var(--radius) 0 0;
  width: 100%;
  max-width: 600px;
  padding: 20px 20px 40px;
  max-height: 80vh;
  overflow-y: auto;
}
.sheet-handle {
  width: 36px; height: 4px;
  background: var(--border-lt);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.detail-icon-row {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 14px;
}
.detail-icon-bg {
  width: 56px; height: 56px;
  border-radius: 14px;
  background: var(--bg-card2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.detail-icon-bg svg { color: var(--accent); }
.detail-name {
  font-family: 'Fraunces', serif;
  font-size: 20px;
  font-weight: 300;
  color: var(--ink);
  line-height: 1.2;
}
.detail-note-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--ink-3);
  margin-bottom: 6px;
}
.detail-note-ta {
  width: 100%;
  min-height: 80px;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--ink);
  resize: none;
  line-height: 1.5;
  margin-bottom: 14px;
}
.detail-note-ta:focus { outline: none; border-color: var(--accent); }
.detail-note-ta::placeholder { color: var(--ink-3); font-style: italic; }
.detail-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* Day picker in recipe detail */
.detail-day-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--ink-3);
  margin-bottom: 8px;
  margin-top: 4px;
}
.day-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 16px;
}
.day-chip {
  padding: 5px 11px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-card2);
  border: 1px solid var(--border);
  color: var(--ink-2);
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  cursor: pointer;
}
.day-chip:hover { border-color: var(--accent); color: var(--accent); }
.day-chip.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.day-chip.has-meal {
  border-color: var(--accent);
  color: var(--accent);
}

/* ══════════════════════════════════════════════════════════
   MODALS
══════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 300;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 22px 20px;
  width: 100%; max-width: 340px;
  box-shadow: var(--shadow-md);
}
.modal-box h3 {
  font-family: 'Fraunces', serif;
  font-size: 18px; font-weight: 300;
  margin-bottom: 6px;
}
.modal-box p { font-size: 13px; color: var(--ink-2); margin-bottom: 14px; line-height: 1.5; }
.modal-input {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 14px;
}
.modal-input:focus { outline: none; border-color: var(--accent); }
.modal-btns { display: flex; justify-content: flex-end; gap: 8px; }

/* ── TOAST ───────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg-card);
  color: var(--ink);
  border: 1px solid var(--border);
  padding: 10px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  box-shadow: var(--shadow-md);
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 999;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── EMPTY STATES ────────────────────────────────────────── */
.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-3);
}
.empty svg { margin-bottom: 10px; }
.empty p { font-size: 13px; }

/* ── CHECKMARK SVG ───────────────────────────────────────── */
.check-icon {
  display: none;
}
.shop-item.is-checked .check-icon { display: block; }
</style>

<!-- MAIN -->
<main class="main-content">

  <!-- ── SHOPPING ── -->
  <section class="tab-panel active" id="tab-shopping">
    <div class="section-head">
      <h2 class="section-title">Shopping</h2>
    </div>
<!-- Add form -->
    <div class="add-form">
      <div class="add-row-main">
        <input type="text" id="newItemName" placeholder="Add an item…" onkeydown="if(event.key==='Enter')addShopItem()" oninput="onItemNameInput(this)">
        <div class="qty-wrap">
          <button class="qty-btn" onclick="adjQty(-1)">−</button>
          <span class="qty-val" id="qtyVal">1</span>
          <button class="qty-btn" onclick="adjQty(1)">+</button>
        </div>
        <button class="btn-primary" onclick="addShopItem()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add
        </button>
      </div>
      <div class="add-row-sub">
        <select id="newItemCat"><option value="">Category…</option></select>
        <input type="text" id="newItemNote" placeholder="Note (optional)…" onkeydown="if(event.key==='Enter')addShopItem()">
      </div>
    </div>

    <div id="shoppingList"></div>

    <div class="shopping-footer">
      <span class="checked-summary" id="checkedSummary"></span>
      <div class="footer-btns">
        <button class="btn-ghost" onclick="uncheckAll()">Uncheck all</button>
        <button class="btn-danger" onclick="confirmRemoveChecked()">Remove checked</button>
      </div>
    </div>
  </section>

  <!-- ── PLANNER ── -->
  <section class="tab-panel" id="tab-planner">
    <div class="section-head">
      <h2 class="section-title">This Week</h2>
    </div>
  
    <div id="plannerDays"></div>
    <div class="planner-footer">
      <button class="btn-danger" onclick="confirmClearPlanner()">Clear week</button>
    </div>
  </section>

  <!-- ── RECIPES ── -->
  <section class="tab-panel" id="tab-recipes">
    <div class="section-head">
      <h2 class="section-title">Recipes</h2>
      <button class="btn-primary" onclick="openAddRecipe()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add
      </button>
    </div>
    <div class="recipe-search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="recipe-search" type="text" placeholder="Search recipes…" oninput="renderRecipes(this.value)" id="recipeSearch">
    </div>
    <div class="recipes-wrap">
      <div class="recipe-grid" id="recipeGrid"></div>
      <div class="az-index" id="azIndex"></div>
    </div>
  </section>

</main>

<!-- BOTTOM TAB BAR -->
<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('shopping',this)" id="tabBtnShopping">

</div><!-- /app-shell -->

<!-- RECIPE DETAIL SHEET -->
<div class="recipe-detail-overlay" id="recipeDetailOverlay" onclick="closeDetail(event)">
  <div class="recipe-detail-sheet" id="recipeDetailSheet">
    <div class="sheet-handle"></div>
    <div class="detail-icon-row">
      <div class="detail-icon-bg" id="detailIconBg"></div>
      <div class="detail-name" id="detailName"></div>
    </div>
    <div class="detail-day-label">Add to week</div>
    <div class="day-picker" id="detailDayPicker"></div>
    <div class="detail-note-label">Notes & Links</div>
    <textarea class="detail-note-ta" id="detailNoteTa" placeholder="Add a link, reminder, or note about this recipe…" rows="3"></textarea>
    <div class="detail-actions">
      <button class="detail-delete-btn" id="detailDeleteBtn" title="Delete recipe">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
        Delete
      </button>
      <div style="display:flex;gap:8px">
        <button class="btn-ghost" onclick="closeRecipeDetail()">Done</button>
        <button class="btn-primary" onclick="saveRecipeDetail()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ADD RECIPE MODAL -->
<div class="modal-overlay" id="addRecipeModal">
  <div class="modal-box">
    <h3>New Recipe</h3>

function recipeIconKey(name) {
  const n = name.toLowerCase().trim();
  if (RECIPE_ICON_MAP[n]) return RECIPE_ICON_MAP[n];
  // Keyword fallback so new recipes always get something sensible
  if (/halloumi|cheese/.test(n))                                    return 'cheese';
  if (/salmon|fish|seafood|prawn|tuna/.test(n))                     return 'fish';
  if (/salad/.test(n))                                              return 'salad';
  if (/mushroom/.test(n))                                           return 'mushroom';
  if (/sausage/.test(n))                                            return 'sausage';
  if (/burger|reuben|sandwich|sub/.test(n))                         return 'burger';
  if (/wrap|roll|bread|falafel|burrito|pita|schnitzel wrap/.test(n)) return 'bread';
  if (/pizza|flatbread/.test(n))                                    return 'pizza';
  if (/nacho|nachos/.test(n))                                       return 'salt';
  if (/pasta|spaghetti|bolognese|linguine|fettuccine|penne/.test(n)) return 'pasta';
  if (/ramen|noodle|stir.?fry|asian|curry|udon/.test(n))           return 'bowl-chopsticks';
  if (/kofta|souvlaki|skewer|kebab|satay|meat/.test(n))            return 'meat';
  if (/chilli|chili|pepper|spicy/.test(n))                         return 'pepper';
  if (/grill|bbq/.test(n))                                         return 'grill';
  if (/quiche|frittata|egg/.test(n))                               return 'egg';
  if (/lemon|citrus/.test(n))                                      return 'lemon';
  if (/carrot|veg/.test(n))                                        return 'carrot';
  if (/avocado/.test(n))                                           return 'avocado';
  if (/soup|broth|lentil|ribollita|pea.+ham|bisque/.test(n))       return 'soup';
  if (/stew|slow.?cook|casserole|one.?pot/.test(n))                return 'cooker';
  if (/roast|pie|bake/.test(n))                                     return 'roast';
  if (/rice|bowl/.test(n))                                          return 'bowl';
  if (/cake|dessert|sweet|cookie/.test(n))                         return 'cake';
  if (/coffee|cafe/.test(n))                                        return 'coffee';
  if (/milk|dairy/.test(n))                                         return 'milk';
  if (/lamb|beef|pork|chicken|poultry|duck|turkey/.test(n))        return 'meat';
  return 'pasta';
}

function recipeIcon(name, size=32) {
  const key = recipeIconKey(name);
  return TABLER_ICONS[key] || TABLER_ICONS['pasta'];
}

function init() {
  // Theme
  const savedTheme = localStorage.getItem('hearth_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon(savedTheme);
  document.getElementById('appLogo').src = savedTheme === 'dark' ? LOGO_WHITE : LOGO_BLACK;

  scriptUrl = 'https://script.google.com/macros/s/AKfycbyI121anf9FOOuptroWtaLvVdmtKPuDxX7Z1PX0cUNSbiB66_6MkRASromg3zcvaHA/exec';

  // Populate category selects
  const sel = document.getElementById('newItemCat');
  CATEGORIES.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = c; sel.appendChild(o);
  });

  loadLocal();
  pullFromSheet();

  renderAll();
}

// ── THEME ──────────────────────────────────────────────────
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('hearth_theme', next);
  updateThemeIcon(next);
  document.getElementById('appLogo').src = next === 'dark' ? LOGO_WHITE : LOGO_BLACK;
}
function updateThemeIcon(theme) {
  const icon = document.getElementById('themeIcon');
  if (theme === 'dark') {
    // Show sun (switch to light)
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  } else {
    // Show moon (switch to dark)
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
  }
}

// ── TABS ───────────────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

// ── LOCAL STORAGE ──────────────────────────────────────────
function loadLocal() {
  const raw = localStorage.getItem('hearth_data');
  if (raw) { try { S = JSON.parse(raw); } catch(e) {} }
  if (!S.recipes || S.recipes.length === 0) {
    S.recipes = INITIAL_RECIPES.map((n,i) => ({ id:'r'+(i+1), name:n, note:'' }));
    S.mealPlan = DAYS.map(d => ({ day:d, meal:'', note:'' }));
    S.shopping = [];
    saveLocal();
  }
}
function saveLocal() { localStorage.setItem('hearth_data', JSON.stringify(S)); }
function scheduleSave() {
  saveLocal();
  if (scriptUrl) { clearTimeout(saveTimer); saveTimer = setTimeout(pushToSheet, 2000); }
}

// ── SYNC ───────────────────────────────────────────────────
function setSyncState(state) { // 'idle'|'syncing'|'ok'|'err'
  const dot = document.getElementById('syncDot');
  const btn = document.getElementById('syncBtn');
  dot.className = 'sync-dot' + (state==='ok' ? ' ok' : state==='err' ? ' err' : '');
  btn.classList.toggle('syncing', state==='syncing');
}
async function pullFromSheet() {
  if (!scriptUrl) return;
  setSyncState('syncing');
  try {
    const r = await fetch(scriptUrl + '?action=getAll');
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    const sheetHasData = d.recipes?.length || d.mealPlan?.some(m=>m.meal) || d.shopping?.length;

    if (sheetHasData) {
      // Sheet has real data — pull it down
      if (d.recipes?.length) {
        // Deduplicate by name (case-insensitive), keep last occurrence
        const seen = new Map();
        d.recipes
          .filter(r => r.name && r.name.toString().trim())
          .forEach(r => seen.set(r.name.trim().toLowerCase(), r));
        S.recipes = Array.from(seen.values());
      }
      if (d.mealPlan?.length) S.mealPlan = d.mealPlan;
      if (d.shopping?.length) S.shopping = d.shopping.map(i=>({
        ...i, checked: i.checked==='TRUE'||i.checked===true, quantity: parseInt(i.quantity)||1
      }));
      saveLocal(); renderAll();
      // Push deduped data back to Sheet to clean it up
      await pushToSheet();
    } else {
      // Sheet is empty — push our local data up to it
      await pushToSheet();
    }

    setSyncState('ok');
    setTimeout(()=>setSyncState('idle'), 3000);
  } catch(e) { setSyncState('err'); }
}
async function pushToSheet() {
  if (!scriptUrl) return;
  setSyncState('syncing');
  try {
    const post = (body) => fetch(scriptUrl, { method:'POST', body: JSON.stringify(body) });
    await post({ action:'saveRecipes', recipes: S.recipes });
    await post({ action:'saveMealPlan', mealPlan: S.mealPlan });
    await post({ action:'saveShopping', items: S.shopping });
    setSyncState('ok'); setTimeout(()=>setSyncState('idle'), 3000);
  } catch(e) { setSyncState('err'); }
}
function syncAll() {
  pullFromSheet();
}

function getWeekDates() {
  const now = new Date(); const dow = now.getDay();
  const diff = (dow + 2) % 7;
  const fri = new Date(now); fri.setDate(now.getDate() - diff);
  return DAYS.map((_,i) => { const d=new Date(fri); d.setDate(fri.getDate()+i); return d; });
}

function renderPlanner() {
  const dates = getWeekDates();
  const today = new Date(); today.setHours(0,0,0,0);

  DAYS.forEach(d => { if (!S.mealPlan.find(m=>m.day===d)) S.mealPlan.push({day:d,meal:'',note:''}); });



  const con = document.getElementById('plannerDays'); con.innerHTML='';
  dates.forEach((date,i) => {
    const day=DAYS[i];
    const entry=S.mealPlan.find(m=>m.day===day)||{day,meal:'',note:''};
    date.setHours(0,0,0,0);

function updateSugg(inp) {
  const day=inp.dataset.day, q=inp.value.toLowerCase();
  const box=document.getElementById('sug-'+day);
  if(!box) return;
  const sorted=[...S.recipes].sort((a,b)=>a.name.localeCompare(b.name));
  const matches=sorted.filter(r=>r.name.toLowerCase().includes(q)).slice(0,8);
  if(!matches.length){box.classList.remove('open');box.innerHTML='';return;}
  box.innerHTML=matches.map(r=>`
    <div class="sug-item" onmousedown="pickSugg(event,'${day}','${esc(r.name).replace(/'/g,"\\'")}')">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
      ${esc(r.name)}</div>`).join('');
  box.classList.add('open');
}
function hideSugg(inp) {
  const day=inp.dataset.day;
  setTimeout(()=>{const b=document.getElementById('sug-'+day);if(b){b.classList.remove('open');b.innerHTML='';}},150);
}
function pickSugg(e,day,name) {
  e.preventDefault();
  const entry=S.mealPlan.find(m=>m.day===day);
  if(entry) entry.meal=name;
  const inp=document.querySelector(`.meal-input[data-day="${day}"]`);
  if(inp) inp.value=name;
  const box=document.getElementById('sug-'+day);
  if(box){box.classList.remove('open');box.innerHTML='';}
  scheduleSave();
}
function mealKey(e,inp) {
  const day=inp.dataset.day, box=document.getElementById('sug-'+day);
  const items=box?box.querySelectorAll('.sug-item'):[];
  const hi=box?box.querySelector('.hi'):null;
  if(e.key==='ArrowDown'){e.preventDefault();
    if(!items.length)return;
    if(!hi)items[0].classList.add('hi');
    else{hi.classList.remove('hi');const n=hi.nextElementSibling;if(n)n.classList.add('hi');else items[0].classList.add('hi');}
  }else if(e.key==='ArrowUp'){e.preventDefault();
    if(!hi)return; hi.classList.remove('hi');
    const p=hi.previousElementSibling;if(p)p.classList.add('hi');else items[items.length-1].classList.add('hi');
  }else if(e.key==='Enter'&&hi){hi.dispatchEvent(new MouseEvent('mousedown'));
  }else if(e.key==='Escape'&&box){box.classList.remove('open');box.innerHTML='';}
}

function renderRecipes(filter) {
  const q=(filter||'').toLowerCase();
  const grid=document.getElementById('recipeGrid');
  const azEl=document.getElementById('azIndex');

  // Filter blanks, filter by search, sort alphabetically
  const filtered=S.recipes
    .filter(r=>r.name && r.name.toString().trim())
    .filter(r=>r.name.toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name));

  if(!filtered.length){
    grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg><p>No recipes found</p></div>`;
    if(azEl) azEl.innerHTML='';
    return;
  }

  // Group by first letter
  const groups={};
  filtered.forEach(r=>{
    const letter=r.name[0].toUpperCase();
    if(!groups[letter]) groups[letter]=[];
    groups[letter].push(r);
  });

  // Build grid with letter group headers
  const letters=Object.keys(groups).sort();
  const isFiltering=q.length>0;

  grid.innerHTML=letters.map(letter=>{
    const cards=groups[letter].map(r=>`
      <div class="recipe-card" id="rc-${r.id}" onclick="openRecipeDetail('${r.id}')">
        <div class="recipe-card-icon">${recipeIcon(r.name)}</div>
        <div class="recipe-card-body">
          <div class="recipe-card-name">${esc(r.name)}</div>
          ${r.note?`<div class="recipe-card-note">${esc(r.note)}</div>`:''}
        </div>
      </div>`).join('');
    const header=isFiltering?'':`<div class="recipe-letter-group" id="letter-${letter}">${letter}</div>`;
    return header+cards;
  }).join('');

  // Build A-Z sidebar (only when not filtering)
  if(azEl){
    if(isFiltering){ azEl.innerHTML=''; return; }
    const allLetters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    azEl.innerHTML=allLetters.map(l=>{
      const has=!!groups[l];
      return `<div class="az-letter${has?' has-recipes':' no-recipes'}"
        onclick="${has?`scrollToLetter('${l}')`:''}">${l}</div>`;
    }).join('');
  }
}

function scrollToLetter(letter) {
  const el=document.getElementById('letter-'+letter);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  // Flash active state
  document.querySelectorAll('.az-letter').forEach(l=>{
    l.classList.toggle('active', l.textContent===letter);
  });
  setTimeout(()=>document.querySelectorAll('.az-letter').forEach(l=>l.classList.remove('active')), 800);
}

  const r=S.recipes.find(x=>x.id===reicpeId||x.name===recipeName);

function buildDayPicker(recipeId, recipeName) {
  const picker=document.getElementById('detailDayPicker');
  if(!picker) return;
  picker.innerHTML='';
  DAYS.forEach(day=>{
    const entry=S.mealPlan.find(m=>m.day===day)||{day,meal:'',note:''};
    const isAssigned = entry.meal===recipeName;
    const hasDifferentMeal = !!entry.meal && !isAssigned;
    const chip=document.createElement('button');
    chip.className='day-chip'+(isAssigned?' selected':hasDifferentMeal?' has-meal':'');
    chip.textContent=day.slice(0,3);
    chip.title=hasDifferentMeal?`${day}: ${entry.meal}`:day;
    chip.onclick=()=>toggleDayAssign(recipeId, day, recipeName);
    picker.appendChild(chip);
  });
}

function guessCategory(itemName) {
  const n = itemName.toLowerCase().trim();
  const order = [
    'Household & Cleaning','Health & Personal Care','Pet Supplies',
    'Meat','Seafood','Dairy & Eggs','Produce','Bakery',
    'Pasta & Sides','Grains','Soup & Canned Goods','Drinks','Freezer',
    'Condiments & Dressings','Cooking & Baking',
    'Breakfast & Cereal','Snacks','Deli','Other'
  ];
  for (const cat of order) {
    if (CAT_KEYWORDS[cat] && CAT_KEYWORDS[cat].test(n)) return cat;
  }
  return 'Other';
}

function onItemNameInput(inp) {
  const name = inp.value.trim();
  const sel = document.getElementById('newItemCat');
  if (name.length < 3) {
    sel.value = '';
    return;
  }
  sel.value = guessCategory(name);
}

// ── MODALS ─────────────────────────────────────────────────
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
let _confirmCb=null;
function confirm2(title,msg,cb) {
  document.getElementById('confirmTitle').textContent=title;
  document.getElementById('confirmMsg').textContent=msg;
  _confirmCb=cb;
  document.getElementById('confirmModal').classList.add('open');
  document.getElementById('confirmOkBtn').onclick=()=>{closeModal('confirmModal');if(_confirmCb)_confirmCb();};
}
document.querySelectorAll('.modal-overlay').forEach(el=>{
  el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');});
});

// ── TOAST ──────────────────────────────────────────────────
function toast(msg, type) {
  const el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast'+(type?' '+type:'');
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2400);
}

// ── UTILS ──────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

init();

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/robb-shop/sw.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.log('SW failed:', err));
  });
}
